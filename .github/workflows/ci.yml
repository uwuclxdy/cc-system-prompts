name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # exact, not a floating major: astral-sh stopped publishing one past v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # pinned, not the runner's apt shellcheck: ubuntu-24.04 ships 0.9.0, which
      # flags SC3013 and SC2015 that 0.11.0 does not, so an unpinned gate reds on
      # a runner image bump alone
      - run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 scripts/*.sh shim/claude
