name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # exact, not a floating major: astral-sh stopped publishing one past v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # pinned through .shellcheck-version so CI and local runs check with the
      # same shellcheck release
      - name: shellcheck
        run: |
          ver=$(cat .shellcheck-version)
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" "shellcheck-${ver}/shellcheck"
          "$RUNNER_TEMP/shellcheck-${ver}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${ver}/shellcheck" -- scripts/*.sh
