name: refresh captures

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # exact, not a floating major: astral-sh stopped publishing one past v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Refresh captures
        run: ./scripts/refresh-captures.sh

      - name: Summarize
        if: always()
        run: cat drift-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Detect drift
        id: drift
        run: |
          # porcelain, not `git diff`: a new release lands as untracked files,
          # which git diff never sees
          if [ -z "$(git status --porcelain -- captures/ archive/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR on drift
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # a PR opened with the default token dispatches no workflow runs, so
          # ci reported an empty run as a failure on every refresh. with the
          # secret unset, the fallback leaves this step on the default token
          token: ${{ secrets.REFRESH_PAT || github.token }}
          branch: chore/refresh-captures
          add-paths: |
            captures/**
            captures/meta.json
            archive/**
            archive/**/meta.json
          delete-branch: true
          commit-message: 'docs(captures): refresh upstream system prompts'
          title: 'docs(captures): refresh upstream system prompts'
          body-path: drift-report.md
