[project]
name            = "cc-system-prompts"
version         = "0.1.0"
description     = "extract Claude Code per-model system prompts as reviewable diffs"
requires-python = ">=3.12"
license         = { text = "MIT" }
dependencies = []

[project.scripts]
cc-prompts-capture  = "cc_prompts.capture:main"
cc-prompts-subagent = "cc_prompts.subagent:main"
cc-prompts-refresh  = "cc_prompts.refresh:main"
cc-prompts-versions = "cc_prompts.versions:main"
cc-prompts-install  = "cc_prompts.install:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_prompts"]

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-n auto --dist loadscope --timeout=30 --timeout-method=thread"
